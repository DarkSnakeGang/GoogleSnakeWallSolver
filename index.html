<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Google Snake Wall Solver</title>
  <style>
    :root {
      --bg: #12141a;
      --card: #1c2028;
      --line: #2c3340;
      --text: #e8ecf1;
      --muted: #93a0b0;
      --go: #2f9e5f;
      --stop: #c9a227;
      --board-cell: 28px;
      --board-gap: 0px;
      --board-chk-a: #1a1a1f;
      --board-chk-b: #24242c;
      --board-wall: #050505;
      --board-frame: #2e2e36;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      font: 14px/1.35 "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      background: #161922;
    }
    header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
    }
    header label {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
    }
    button, select {
      font: inherit;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #252b36;
      color: var(--text);
      padding: 5px 10px;
      cursor: pointer;
    }
    button.go { background: var(--go); border-color: var(--go); color: #fff; font-weight: 700; }
    button.pause { background: var(--stop); border-color: var(--stop); color: #1a1400; font-weight: 700; }
    button:disabled { opacity: 0.45; cursor: default; }
    .meta { color: var(--muted); font-size: 12px; margin: 0 0 6px; }
    main {
      flex: 1 1 auto;
      min-height: 0;
      padding: 8px 14px 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .row {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      gap: 12px;
      flex-wrap: nowrap;
      align-items: stretch;
      overflow: hidden;
    }
    .row > div:first-child {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .row > div:last-child {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #boardBtns {
      flex: 0 0 auto;
      margin: 8px 0 0;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .board-wrap {
      position: relative;
      width: max-content;
      flex: 0 0 auto;
      background: #121216;
      border: 3px solid var(--board-frame);
      border-radius: 6px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }
    .snake-svg {
      position: absolute;
      left: 0; top: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      overflow: visible;
    }
    .grid {
      display: grid;
      gap: var(--board-gap);
      width: max-content;
      background: var(--board-chk-a);
    }
    .cell {
      width: var(--board-cell);
      height: var(--board-cell);
      background: var(--board-chk-a);
      cursor: pointer;
      user-select: none;
    }
    .cell.chk { background: var(--board-chk-b); }
    .cell.wall { background: var(--board-wall); }
    .cell.proof { box-shadow: inset 0 0 0 3px #d15b5b; }
    textarea {
      width: 100%;
      height: 64px;
      background: #12141a;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 12px;
      flex: 0 0 auto;
      resize: vertical;
    }
    .board-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 6px 0;
      flex: 0 0 auto;
    }
    .chip {
      padding: 3px 8px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 12px;
      background: #2a3140;
      color: var(--text);
    }
    .chip.cycle { background: #1d3d2a; color: #8ee0ad; }
    .chip.path { background: #243044; color: #8eb4ea; }
    .chip.none { background: #3d2222; color: #f0a0a0; }
    .chip.best { background: #3d3520; color: #f0d27a; }
    .chip.notbest { background: #2a3140; color: var(--muted); }
    .board-status {
      font: 13px/1.35 ui-monospace, Consolas, monospace;
      background: #12141a;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      margin: 0 0 6px;
      color: var(--text);
      white-space: pre-wrap;
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
    }
    .board-status.tour-best { border-color: #b8922a; }
    .board-status.tour-open { border-color: #4a6280; }
    #solveLog {
      font: 12px/1.3 ui-monospace, Consolas, monospace;
      background: #12141a;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 10px;
      margin: 0;
      max-height: 28vh;
      overflow: auto;
      color: var(--muted);
      white-space: pre-wrap;
      flex: 0 1 auto;
    }
    @media (max-width: 820px) {
      .row { flex-direction: column; overflow: auto; }
      .row > div:last-child { flex: 1 1 auto; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Google Snake Wall Solver</h1>
    <label>Size
      <select id="boardSize"></select>
    </label>
  </header>
  <main>
    <section class="card">
      <p class="meta">Click cells to toggle walls · Paste pudding <code>pattern 12…</code> or 0/1 bits · Share with <code>?board=…</code> and <code>&amp;solve=1</code> to auto-solve · Stop aborts</p>
      <div class="row">
        <div>
          <div class="board-wrap">
            <div class="grid" id="board"></div>
            <svg class="snake-svg" id="snakeSvg" aria-hidden="true"></svg>
          </div>
          <p id="boardBtns">
            <button type="button" class="go" id="solve">Solve</button>
            <button type="button" class="pause" id="stop" disabled>Stop</button>
            <button type="button" id="boardRandom">Random</button>
            <button type="button" id="copyBits">Copy pattern</button>
            <button type="button" id="clearBoard">Clear</button>
          </p>
        </div>
        <div>
          <textarea id="bits" spellcheck="false" placeholder="Paste pattern bits…"></textarea>
          <div class="board-chips" id="boardChips"></div>
          <div class="board-status" id="boardOut">No board loaded.</div>
          <pre id="solveLog" hidden></pre>
        </div>
      </div>
    </section>
  </main>
  <script type="module" src="./js/board.js"></script>
</body>
</html>
